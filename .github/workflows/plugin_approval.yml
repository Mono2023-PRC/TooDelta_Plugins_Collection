name: Plugin Approval

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    if: |
      github.event.issue.pull_request == null &&
      contains(join(github.event.issue.labels.*.name, ','), 'plugin-submission') &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests
      
      - name: Extract issue number
        id: extract_issue
        run: echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
      
      - name: Approve plugin
        id: approve
        run: |
          python scripts/auto_approve.py ${{ steps.extract_issue.outputs.issue_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          git commit -m "feat: approve plugin \
            - Plugin: ${{ fromJSON(steps.approve.outputs.plugin_key || '{}') || 'unknown' }}" \
            -m "Auto-approved by ${{ github.event.comment.user.login }} via /approve command" \
            -m "Closes #${{ steps.extract_issue.outputs.issue_number }}"
          git push